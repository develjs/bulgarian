const { useState, useMemo, useCallback } = React;

/* ---------------- Levenshtein & normalization helpers ---------------- */

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[m][n];
}

function normalize(str) {
  return (str || "")
    .toLowerCase()
    .replace(/[.,!?;:"'«»()„“]/g, "")
    .trim()
    .replace(/\s+/g, " ");
}

function stripAll(str) {
  return normalize(str).replace(/\s+/g, "");
}

function evaluateAnswer(userValue, answers) {
  const userNorm = normalize(userValue);
  const userStripped = stripAll(userValue);
  if (!userStripped) return { result: "wrong", bestAnswer: answers[0] };

  for (const ans of answers) {
    if (normalize(ans) === userNorm) {
      return { result: "correct", bestAnswer: ans };
    }
  }

  let bestDist = Infinity;
  let bestAnswer = answers[0];
  for (const ans of answers) {
    const ansStripped = stripAll(ans);
    const dist = levenshtein(userStripped, ansStripped);
    if (dist < bestDist) {
      bestDist = dist;
      bestAnswer = ans;
    }
  }
  const ansLen = stripAll(bestAnswer).length || 1;
  if (bestDist / ansLen <= 0.3) {
    return { result: "close", bestAnswer };
  }
  return { result: "wrong", bestAnswer };
}

/* ---------------- Comments ---------------- */

const CORRECT_COMMENTS = ["Отлично!", "Перфектно!", "Браво!", "Супер!", "Точно така!", "Много добре!", "Великолепно!", "Ти си звезда!", "Продължавай така!", "Чудесно!"];
const CLOSE_COMMENTS = ["Почти!", "Близо!", "Малко повече!", "Добър опит!", "Почти перфектно!", "Не се отказвай!", "Много близо!", "Само малко поправка!", "Добре си!", "Още малко!"];
const WRONG_COMMENTS = ["Не се притеснявай!", "Ще стане!", "Дръж се!", "Учиш се!", "Няма проблем!", "Следващия път!", "Практиката прави майстора!", "Напред!", "Не се предавай!", "Всеки греши!"];

function randomComment(result) {
  const list = result === "correct" ? CORRECT_COMMENTS : result === "close" ? CLOSE_COMMENTS : WRONG_COMMENTS;
  return list[Math.floor(Math.random() * list.length)];
}

      { type: "translate", ru: "Когда я закончу работу, пойду домой.", answers: ["когато свърша работа ще отида вкъщи"], explanation: "'Когато' въвежда подчинено изречение в сегашно време; 'ще' е само в главното ('ще отида')." },
      { type: "translate", ru: "Как только я приеду в магазин, куплю хлеб.", answers: ["щом стигна до магазина ще купя хляб"], explanation: "След 'щом' глаголът е в сегашно време; 'ще' се появява само в главното изречение." },
      { type: "translate", ru: "Пока ты ждёшь, я прочитаю книгу.", answers: ["докато чакаш ще прочета книгата"], explanation: "'Докато' + сегашно време показва действие, което трае; 'ще' е само в главното изречение." },
      { type: "translate", ru: "Когда я закончу школу, найду работу.", answers: ["когато завърша училище ще намеря работа"], explanation: "'Когато' въвежда бъдещо събитие в сегашно време; 'ще' стои само в главното изречение." },
      { type: "translate", ru: "Если ты позвонишь, я приду сразу.", answers: ["ако се обадиш ще дойда веднага"], explanation: "Подчиненото изречение с 'ако' остава в сегашно време, без 'ще', за разлика от руския еквивалент." },
    ],
  },
  // Упражнение 6 — микс
  {
    title: "Упражнение 6",
    subtitle: "Смесени упражнения — обобщение",
    items: [
      { type: "input", before: "Ако ", after: " рано, ще хванем влака.", hint: "ставаме", answers: ["станем"], explanation: "След 'ако' се използва сегашна перфектна форма ('станем'), без 'ще' — действието е еднократно и завършено." },
      { type: "input", before: "Щом ", after: " у дома, ще ти звънна.", hint: "пристигам", answers: ["пристигна"], explanation: "'пристигна' е перфектната форма, използвана след 'щом' в сегашно време, без 'ще'." },
      { type: "select", before: "", after: " не се обадиш до довечера, ще се притесня.", options: ["ако", "когато", "щом", "докато"], answers: ["ако"], explanation: "Обаждането или неговата липса е несигурно условие — 'ако' изразява точно такава несигурност." },
      { type: "select", before: "", after: " съм на работа, не отговарям на телефона.", options: ["ако", "когато", "щом", "докато"], answers: ["докато"], explanation: "Двете състояния (да си на работа и да не отговаряш) се случват едновременно и продължително — това е значението на 'докато'." },
      { type: "translate", ru: "Если ты устал, отдохни.", answers: ["ако си уморен почини си"], explanation: "Главното изречение тук е заповед (императив), затова няма 'ще'; подчиненото с 'ако' остава в сегашно време." },
      { type: "translate", ru: "Когда придёт лето, поедем на море.", answers: ["когато дойде лятото ще отидем на море"], explanation: "'Когато' + сегашна перфектна форма ('дойде') за бъдещо събитие; 'ще' е само в главното изречение." },
    ],
  },
];

const TOTAL_ITEMS = EXERCISES.reduce((sum, ex) => sum + ex.items.length, 0); // 60

function makeEmptyPageState(items) {
  return items.map(() => ({ value: "", checked: false, result: null, comment: "" }));
}

function makeEmptyAllState() {
  return EXERCISES.map((ex) => makeEmptyPageState(ex.items));
}

/* ---------------- UI subcomponents ---------------- */

function FeedbackIcon({ result }) {
  if (result === "correct") return <span className="icon-correct">✓</span>;
  if (result === "close") return <span className="icon-close">⚠</span>;
  if (result === "wrong") return <span className="icon-wrong">✗</span>;
  return null;
}

function fieldClass(result) {
  if (result === "correct") return "field-correct";
  if (result === "close") return "field-close";
  if (result === "wrong") return "field-wrong";
  return "";
}

function SentenceCard({ index, item, state, onChange, onCheck }) {
  const { value, checked, result, comment } = state;
  const shakeClass = checked && result === "wrong" ? "animate-shake" : "";

  const handleCheck = () => {
    if (checked) return;
    onCheck(value);
  };

  let content;
  if (item.type === "translate") {
    content = (
      <div>
        <div className="translate-label">Руски:</div>
        <div className="translate-source">{item.ru}</div>
        <input
          type="text"
          value={value}
          disabled={checked}
          onChange={(e) => onChange(e.target.value)}
          placeholder="Напиши превода тук..."
          className={`field-base field-block ${fieldClass(result)}`}
        />
      </div>
    );
  } else if (item.type === "select") {
    content = (
      <div className="sentence-text">
        <span>{item.before}</span>
        <select
          value={value}
          disabled={checked}
          onChange={(e) => onChange(e.target.value)}
          className={`field-base field-inline ${fieldClass(result)}`}
        >
          <option value="">— избери —</option>
          {item.options.map((opt) => (
            <option key={opt} value={opt}>{opt}</option>
          ))}
        </select>
        <span>{item.after}</span>
      </div>
    );
  } else {
    // input
    content = (
      <div className="sentence-text">
        <span>{item.before}</span>
        <input
          type="text"
          value={value}
          disabled={checked}
          onChange={(e) => onChange(e.target.value)}
          size={Math.max(6, (item.answers[0] || "").length + 2)}
          className={`field-base field-inline ${fieldClass(result)}`}
        />
        <span>{item.after}</span>
        {item.hint && <span className="hint-text">({item.hint})</span>}
      </div>
    );
  }

  return (
    <div className={`sentence-card ${shakeClass}`}>
      <div className="card-row">
        <div className="card-index">{index + 1}</div>
        <div className="card-body">
          {content}

          {checked && result !== "correct" && (
            <div className="correct-answer-line">
              Правилен отговор: <strong>{state.correctAnswer}</strong>
            </div>
          )}
          {checked && state.explanation && (
            <div className="explanation-line">💡 {state.explanation}</div>
          )}

          <div className="card-footer">
            <div className="feedback-row animate-pop">
              {checked && <FeedbackIcon result={result} />}
              {checked && <span className="feedback-comment">{comment}</span>}
            </div>
            {!checked && (
              <button onClick={handleCheck} className="btn btn-check">
                Провери
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function ProgressBar({ total, allTotal }) {
  const pct = Math.round((total / allTotal) * 100);
  return (
    <div className="progress-wrap">
      <div className="progress-labels">
        <span>Общ напредък</span>
        <span>{total} / {allTotal}</span>
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function ExercisePage({ exerciseIndex, exercise, pageState, setPageItem, onPrev, onNext, canGoBack, isLast, allChecked }) {
  const handleCheckOne = (itemIndex, rawValue) => {
    const item = exercise.items[itemIndex];
    const { result, bestAnswer } = evaluateAnswer(rawValue, item.answers);
    setPageItem(itemIndex, {
      value: rawValue,
      checked: true,
      result,
      comment: randomComment(result),
      correctAnswer: bestAnswer,
      explanation: item.explanation || null,
    });
  };

  const handleChangeOne = (itemIndex, val) => {
    setPageItem(itemIndex, { value: val });
  };

  const handleCheckAll = () => {
    exercise.items.forEach((item, i) => {
      if (!pageState[i].checked) {
        handleCheckOne(i, pageState[i].value);
      }
    });
  };

  const hasUnchecked = pageState.some((s) => !s.checked);

  return (
    <div className="container-narrow page-pad">
      <div className="page-head">
        <div className="page-eyebrow">Упражнение {exerciseIndex + 1} от {EXERCISES.length}</div>
        <h1 className="page-title serif-display">{exercise.title}</h1>
        <p className="page-subtitle">{exercise.subtitle}</p>
      </div>

      <div className="card-list">
        {exercise.items.map((item, i) => (
          <SentenceCard
            key={i}
            index={i}
            item={item}
            state={pageState[i]}
            onChange={(val) => handleChangeOne(i, val)}
            onCheck={(val) => handleCheckOne(i, val)}
          />
        ))}
      </div>

      {hasUnchecked && (
        <button onClick={handleCheckAll} className="btn btn-check-all">
          Провери всичко
        </button>
      )}

      <div className="nav-row">
        <button
          onClick={onPrev}
          disabled={!canGoBack}
          className={`btn btn-back ${!canGoBack ? "hidden-btn" : ""}`}
        >
          ← Назад
        </button>

        {allChecked && (
          <button onClick={onNext} className="btn btn-next animate-pop">
            {isLast ? "Завърши →" : "Следващо упражнение →"}
          </button>
        )}
      </div>
    </div>
  );
}

function FinalPage({ totalCorrect, allTotal, onRestart }) {
  const pct = Math.round((totalCorrect / allTotal) * 100);
  let emoji = "💪";
  if (pct >= 90) emoji = "🏆";
  else if (pct >= 75) emoji = "🌟";
  else if (pct >= 60) emoji = "👍";

  return (
    <div className="final-wrap">
      <div className="final-emoji">{emoji}</div>
      <h1 className="final-title serif-display">Готово!</h1>
      <p className="final-sub">Ето твоя резултат от упражненията за условни изречения.</p>

      <div className="final-score-card">
        <div className="final-score-number">{totalCorrect} / {allTotal}</div>
        <div className="final-score-pct">{pct}% правилни отговори</div>
      </div>

      <button onClick={onRestart} className="btn btn-restart">
        Започни отново
      </button>
    </div>
  );
}

/* ---------------- App ---------------- */

function App() {
  const [pageIndex, setPageIndex] = useState(0); // 0..5, then 6 = final
  const [allState, setAllState] = useState(() => makeEmptyAllState());

  const totalCorrect = useMemo(() => {
    let sum = 0;
    allState.forEach((page) => page.forEach((item) => { if (item.checked && item.result === "correct") sum += 1; }));
    return sum;
  }, [allState]);

  const isFinal = pageIndex >= EXERCISES.length;

  const setPageItem = useCallback((itemIndex, patch) => {
    setAllState((prev) => {
      const next = prev.map((p) => p.slice());
      next[pageIndex] = next[pageIndex].slice();
      next[pageIndex][itemIndex] = { ...next[pageIndex][itemIndex], ...patch };
      return next;
    });
  }, [pageIndex]);

  const handleRestart = () => {
    setAllState(makeEmptyAllState());
    setPageIndex(0);
  };

  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="container-narrow progress-wrap">
          <ProgressBar total={totalCorrect} allTotal={TOTAL_ITEMS} />
        </div>
      </header>

      <main className="app-main">
        {isFinal ? (
          <FinalPage totalCorrect={totalCorrect} allTotal={TOTAL_ITEMS} onRestart={handleRestart} />
        ) : (
          <ExercisePage
            key={pageIndex}
            exerciseIndex={pageIndex}
            exercise={EXERCISES[pageIndex]}
            pageState={allState[pageIndex]}
            setPageItem={setPageItem}
            onPrev={() => setPageIndex((p) => Math.max(0, p - 1))}
            onNext={() => setPageIndex((p) => p + 1)}
            canGoBack={pageIndex > 0}
            isLast={pageIndex === EXERCISES.length - 1}
            allChecked={allState[pageIndex].every((s) => s.checked)}
          />
        )}
      </main>

      <footer className="app-footer">
        Учене на български език · Сложноподчинени изречения (условие тип 1)
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
